<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JG TEAM | Sitio Oficial</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050b16;
    color:white;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:480px;
    margin:auto;
    min-height:100vh;
    padding:25px 18px 35px;
    background:
    radial-gradient(circle at top,#123c78 0%,#071426 35%,#03070e 75%);
}

.header{
    text-align:center;
    padding:20px 0 25px;
}

.logo{
    width:125px;
    height:125px;
    margin:auto;
    border-radius:50%;
    border:4px solid #168cff;
    background:linear-gradient(145deg,#0d2d5d,#020812);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 30px rgba(0,132,255,.45);
}

.logo span{
    font-size:34px;
    font-weight:900;
    color:white;
}

h1{
    margin-top:15px;
    font-size:34px;
    letter-spacing:2px;
}

.subtitle{
    margin-top:6px;
    color:#65b7ff;
    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
}

.motto{
    margin-top:15px;
    font-size:12px;
    color:#dcecff;
    font-weight:bold;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.button{
    min-height:68px;
    border-radius:10px;
    border:1px solid #23466f;
    background:linear-gradient(90deg,#0a1525,#111e31);
    display:flex;
    align-items:center;
    text-decoration:none;
    color:white;
    overflow:hidden;
    transition:.2s;
}

.button:active{
    transform:scale(.98);
}

.icon{
    width:70px;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#075ec2;
    font-size:25px;
    font-weight:bold;
}

.button:nth-child(even) .icon{
    background:white;
    color:#075ec2;
}

.text{
    flex:1;
    padding-left:18px;
    font-size:15px;
    font-weight:800;
    letter-spacing:.5px;
}

.arrow{
    padding-right:20px;
    color:#67baff;
    font-size:22px;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#7890aa;
    font-size:11px;
}

.footer strong{
    color:white;
}
</style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="logo">
            <span>JG<br>⚽</span>
        </div>

        <h1>JG TEAM</h1>

        <div class="subtitle">
            FÚTBOL AMATEUR · LA RIOJA
        </div>

        <div class="motto">
            VIVIR Y JUGAR CON GRANDEZA
        </div>

    </header>

    <nav class="menu">

        <a class="button" href="#">
            <div class="icon">🏠</div>
            <div class="text">WEB OFICIAL</div>
            <div class="arrow">›</div>
        </a>

        <a class="button" href="#">
            <div class="icon">👥</div>
            <div class="text">PLANTEL</div>
            <div class="arrow">›</div>
        </a>

        <a class="button" href="#">
            <div class="icon">⚽</div>
            <div class="text">PRÓXIMO PARTIDO</div>
            <div class="arrow">›</div>
        </a>

        <a class="button" href="#">
            <div class="icon">🏆</div>
            <div class="text">RESULTADOS</div>
            <div class="arrow">›</div>
        </a>

        <a class="button" href="#">
            <div class="icon">🏆</div>
            <div class="text">COMPETENCIAS</div>
            <div class="arrow">›</div>
        </a>

        <a class="button" href="#">
            <div class="icon">📖</div>
            <div class="text">HISTORIA</div>
            <div class="arrow">›</div>
        </a>

        <a class="button" href="#">
            <div class="icon">📸</div>
            <div class="text">GALERÍA</div>
            <div class="arrow">›</div>
        </a>

        <a class="button" href="#">
            <div class="icon">👕</div>
            <div class="text">INDUMENTARIA</div>
            <div class="arrow">›</div>
        </a>

        <a class="button" href="#">
            <div class="icon">🤝</div>
            <div class="text">SPONSORS</div>
            <div class="arrow">›</div>
        </a>

        <a class="button" href="#">
            <div class="icon">📲</div>
            <div class="text">CONTACTO</div>
            <div class="arrow">›</div>
        </a>

    </nav>

    <footer class="footer">
        <strong>JG TEAM</strong><br>
        Más que un equipo, una familia.<br><br>
        © 2026 JG TEAM · La Rioja
    </footer>

</div>

</body>
</html>
